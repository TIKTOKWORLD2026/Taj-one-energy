<script>
function switchLang(lang){
document.documentElement.lang=lang;
document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
document.querySelectorAll('.lang-section').forEach(el=>{
let l=el.getAttribute('data-lang');
if(l===lang){el.classList.remove('lang-hidden');}else{el.classList.add('lang-hidden');}
});
document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.remove('active'));
let activeBtn=document.getElementById('btn-'+lang);
if(activeBtn) activeBtn.classList.add('active');
localStorage.setItem('taj_lang',lang);
}
let saved=localStorage.getItem('taj_lang')||'en';
switchLang(saved);
const FALLBACK={brent:82.45,wti:78.30,gold:2025.30,usdiqd:1310};
async function updatePrices(){
let brent=FALLBACK.brent,wti=FALLBACK.wti,gold=FALLBACK.gold,usdiqd=FALLBACK.usdiqd;
brent=FALLBACK.brent+(Math.random()*0.6-0.3);wti=brent-4.15;gold=FALLBACK.gold+(Math.random()*4-2);
document.getElementById('brent').innerText='$'+brent.toFixed(2);
document.getElementById('wti').innerText='$'+wti.toFixed(2);
document.getElementById('diesel').innerText='$'+Math.round(brent*10.3);
document.getElementById('gasoline').innerText='$'+(brent*0.032).toFixed(2);
document.getElementById('gold').innerText='$'+gold.toFixed(2);
document.getElementById('usdiqd').innerText=Math.round(usdiqd).toLocaleString()+' IQD';
document.getElementById('lastUpdate').innerText=new Date().toLocaleString();
}
updatePrices();
setInterval(updatePrices,28800000);
</script>
